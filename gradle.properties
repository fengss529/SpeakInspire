# JVM 参数——Kotlin 编译较吃内存
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ==========================================================
# Gradle 用哪个 JDK —— 故意不写在这里
#
# 关键背景：Android Studio 自带的 JBR 是 JDK 25，
# 而 AGP 8.13 不接受 JDK 25（实测报错就只显示 "25.0.3"）。
# 若让 Gradle 走 Studio 的 JBR，点构建会直接失败。
#
# 所以必须指向一个 JDK 21。但这个路径是**本机绝对路径**，
# 写在这里会跟着 git 走，换台电脑 clone 下来就错了，
# 而错误信息只有一行版本号，极难定位。
#
# 现在放在 GRADLE_USER_HOME/gradle.properties
# （Windows: C:\Users\<你>\.gradle\gradle.properties）：
#
#     org.gradle.java.home=D:/soft/jdk21
#
# 换机器时只改那一处，不要改本文件。
# ==========================================================


# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official

# ---------- 镜像说明 ----------
# 国内镜像配置在 settings.gradle.kts 的 pluginManagement 与
# dependencyResolutionManagement 两处。两处都要配，否则：
# - 只配 pluginManagement → 插件能下，依赖库拉不动
# - 只配 dependencyResolutionManagement → Gradle 插件本身拉不动
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
