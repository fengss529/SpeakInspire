# JVM 参数——Kotlin 编译较吃内存
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ==========================================================
# Gradle 用哪个 JDK
#
# 关键：Android Studio 自带的 JBR 是 JDK 25，
# 而 AGP 8.13 不接受 JDK 25（实测报错就只显示 "25.0.3"）。
# 若让 Gradle 走Studio 的 JBR，点构建会直接失败。
#
# 所以显式指向本机 JDK 21——AGP 8.x 官方支持。
# 这样命令行和 Studio 用同一个 JDK，两边行为一致。
# ==========================================================
org.gradle.java.home=D\:\\soft\\jdk21


# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official

# ---------- 镜像说明 ----------
# 国内镜像配置在 settings.gradle.kts 的 pluginManagement 与
# dependencyResolutionManagement 两处。两处都要配，否则：
# - 只配 pluginManagement → 插件能下，依赖库拉不动
# - 只配 dependencyResolutionManagement → Gradle 插件本身拉不动
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
