name: CI

# 只做一件事：证明「测试全绿」这句话是真的。
# 不构建 APK——签名密钥不在仓库里，也不该在仓库里。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 单元测试（debug + release 两个变体）
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 校验 Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # 项目用 JDK 21 构建。
      # 注意别改成 25：AGP 8.13 不接受，报错只有一行版本号，很难定位。
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4

      # SDK 不靠第三方 action。ubuntu-latest 镜像自带 Android SDK 与 cmdline-tools，
      # 直接用现成的；少了 setup-android 这一层依赖，失败点也少一个。
      # 许可必须显式接受，否则 sdkmanager 会停在交互式提示上（CI 里没人敲 y）。
      - name: 安装平台与构建工具
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "找不到 sdkmanager：$SDKM"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          cat local.properties

      # 两个变体都跑：Release 会开启 R8，混淆规则漏了 keep 只会在这里暴露，
      # 本地一直只构建 debug 的话永远发现不了。
      #
      # chmod 那一行是兜底：这个仓库在 Windows 上提交过，gradlew 的可执行位
      # 曾经是 100644，Linux runner 上 `./gradlew` 直接 Permission denied，
      # 而报错只有一行，很容易被当成「测试挂了」。索引里已经改成 100755。
      - name: 跑测试
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest testReleaseUnitTest --console=plain

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
